<!doctype html>
<html>
<head>
  <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css">
  <style>body { margin: 0 } #map { width: 512px; height: 512px }</style>
</head>
<body>
  <div id="map"></div>
  <script src="/dist/windgl.umd.js"></script>
  <script type="module">
    import * as maplibregl from "/node_modules/maplibre-gl/dist/maplibre-gl.mjs";
    maplibregl.setWorkerUrl("/node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs");
    window.maplibregl = maplibregl;
    window.map = new maplibregl.Map({
      container: "map",
      center: [10, 20],
      zoom: 3,
      canvasContextAttributes: { preserveDrawingBuffer: true },
      style: {
        version: 8,
        sources: {},
        layers: [{ id: "background", type: "background", paint: { "background-color": "black" } }]
      }
    });
    window.mapErrors = [];
    map.on("error", event => mapErrors.push(event.error.message));
    map.on("load", () => { window.ready = true; });
  </script>
</body>
</html>
